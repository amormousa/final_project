<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Green — Blueprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      /* يتم تعبئتها من PROJECT.theme.colors عبر applyTheme() */
      --lime: #CFFF74;
      --olive: #2F3A1D;
      --gray: #8B9183;
      --bg: #F3F4EF;
      --surface: #fff;
      --border: #E1E4D8;
      --border2: #CBD0BE;
      --ink: #1D2412;
      --ink2: #4B5340;
      --ink3: #8B9183;
      --lime-soft: rgba(207, 255, 116, .35);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 18px;
      --nav-h: 64px;
      --font: 'IBM Plex Sans Arabic', 'Inter', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.6
    }

    button {
      font-family: inherit
    }

    /* TOPBAR */
    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--nav-h);
      z-index: 100;
      background: var(--olive);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      text-decoration: none;
      flex-shrink: 0
    }

    .brand-ico {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px
    }

    .brand-name {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.2
    }

    .brand-sub {
      font-size: 10px;
      color: var(--lime);
      letter-spacing: .6px;
      text-transform: uppercase
    }

    .nav {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px
    }

    .nav::-webkit-scrollbar {
      display: none
    }

    .nav-btn {
      background: transparent;
      border: 0;
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--r-sm);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      gap: 6px;
      align-items: center;
      transition: .15s
    }

    .nav-btn i {
      font-style: normal;
      font-size: 10px;
      font-weight: 700;
      font-family: var(--mono);
      background: rgba(207, 255, 116, .18);
      color: var(--lime);
      padding: 1px 6px;
      border-radius: 5px
    }

    .nav-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, .08)
    }

    .nav-btn.on {
      background: var(--lime);
      color: var(--olive)
    }

    .nav-btn.on i {
      background: rgba(47, 58, 29, .15);
      color: var(--olive)
    }

    .burger {
      display: none;
      background: rgba(255, 255, 255, .1);
      border: 0;
      color: #fff;
      font-size: 20px;
      border-radius: 8px;
      padding: 6px 11px;
      cursor: pointer
    }

    .mnav {
      display: none;
      position: fixed;
      inset: var(--nav-h) 0 0 0;
      z-index: 99;
      background: var(--olive);
      padding: 16px;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto
    }

    .mnav.open {
      display: flex
    }

    .mnav .nav-btn {
      padding: 14px 16px;
      font-size: 15px;
      background: rgba(255, 255, 255, .06)
    }

    .app {
      padding-top: var(--nav-h)
    }

    .page {
      display: none;
      animation: fade .3s ease
    }

    .page.on {
      display: block
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .wrap {
      max-width: 1360px;
      margin: 0 auto;
      padding: 48px 28px
    }

    /* TYPE */
    .h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .h2::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .lead {
      color: var(--ink2);
      font-size: 15px;
      max-width: 680px;
      margin-bottom: 28px
    }

    .h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px
    }

    .p {
      font-size: 14px;
      color: var(--ink2);
      line-height: 1.75
    }

    .mono {
      font-family: var(--mono)
    }

    /* HERO */
    .hero {
      background: var(--olive);
      color: #fff;
      border-radius: 0 0 32px 32px;
      padding: 84px 28px 72px;
      text-align: center;
      position: relative;
      overflow: hidden
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(207, 255, 116, .22), transparent 65%);
      top: -200px;
      inset-inline-start: -120px
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(207, 255, 116, .12), transparent 65%);
      bottom: -200px;
      inset-inline-end: -100px
    }

    .kicker {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 18px;
      position: relative
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 60px);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 16px;
      position: relative
    }

    .hero h1 em {
      font-style: normal;
      color: var(--lime)
    }

    .hero p {
      max-width: 640px;
      margin: 0 auto 30px;
      color: rgba(255, 255, 255, .78);
      font-size: 17px;
      position: relative
    }

    .hero-cta {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      position: relative
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 34px;
      position: relative
    }

    .btn {
      border: 0;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 26px;
      border-radius: var(--r-md);
      transition: .15s
    }

    .btn-lime {
      background: var(--lime);
      color: var(--olive)
    }

    .btn-lime:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(207, 255, 116, .35)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .25)
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, .18)
    }

    .btn-olive {
      background: var(--olive);
      color: var(--lime)
    }

    .btn-olive:hover {
      opacity: .9
    }

    .btn-line {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border2)
    }

    /* CARDS */
    .grid {
      display: grid;
      gap: 18px
    }

    .g2 {
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr))
    }

    .g4 {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      transition: .2s
    }

    .card:hover {
      border-color: var(--border2);
      box-shadow: 0 10px 30px rgba(47, 58, 29, .08);
      transform: translateY(-2px)
    }

    .card.flat:hover {
      transform: none;
      box-shadow: none
    }

    .cico {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--lime-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      margin-bottom: 14px
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 11px;
      border-radius: 99px;
      background: var(--lime-soft);
      color: var(--olive);
      white-space: nowrap
    }

    .badge.dark {
      background: var(--olive);
      color: var(--lime)
    }

    .badge.gray {
      background: #E9ECE1;
      color: var(--ink2)
    }

    .badge.line {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--ink2)
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px
    }

    .sect {
      margin-bottom: 48px
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 26px
    }

    .tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink2);
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 99px;
      cursor: pointer;
      transition: .15s;
      white-space: nowrap
    }

    .tab:hover {
      border-color: var(--border2);
      color: var(--ink)
    }

    .tab.on {
      background: var(--olive);
      color: var(--lime);
      border-color: var(--olive)
    }

    .panel {
      display: none
    }

    .panel.on {
      display: block
    }

    /* TOKENS */
    .tok {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 28px
    }

    .tok-c {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px
    }

    .tok-sw {
      height: 56px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, .06);
      margin-bottom: 10px
    }

    .tok-l {
      font-size: 11px;
      color: var(--ink3)
    }

    .tok-v {
      font-size: 12px;
      font-weight: 600;
      font-family: var(--mono)
    }

    .trow {
      display: flex;
      gap: 20px;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border)
    }

    .trow:last-child {
      border: 0
    }

    .trow small {
      min-width: 150px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink3)
    }

    .kv {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px
    }

    .kv div {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 10px 14px
    }

    .kv small {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink3)
    }

    .kv b {
      font-size: 13px;
      font-family: var(--mono)
    }

    /* LISTS */
    .ux {
      list-style: none
    }

    .ux li {
      display: flex;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border)
    }

    .ux li:last-child {
      border: 0
    }

    .num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--olive);
      color: var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0
    }

    .ux b {
      display: block;
      font-size: 14px
    }

    .ux span {
      font-size: 13px;
      color: var(--ink2)
    }

    .code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--olive);
      color: #DDE8C6;
      border-radius: var(--r-md);
      padding: 18px 22px;
      line-height: 1.9;
      white-space: pre;
      overflow-x: auto;
      direction: ltr;
      text-align: left
    }

    .promptbox {
      font-family: var(--mono);
      font-size: 12px;
      background: #F7F8F2;
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 16px 18px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      direction: ltr;
      text-align: left;
      max-height: 460px;
      overflow: auto;
      color: var(--ink2)
    }

    .callout {
      background: var(--lime-soft);
      border-radius: var(--r-md);
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--olive);
      margin-bottom: 12px
    }

    /* SCREENS PAGE */
    .sc-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 22px;
      align-items: start
    }

    .sc-side {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 12px;
      position: sticky;
      top: calc(var(--nav-h) + 16px);
      max-height: calc(100vh - var(--nav-h) - 40px);
      overflow-y: auto
    }

    .sc-g {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink3);
      padding: 12px 10px 4px
    }

    .sc-item {
      display: flex;
      gap: 10px;
      align-items: center;
      width: 100%;
      text-align: start;
      background: transparent;
      border: 0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      color: var(--ink2);
      cursor: pointer
    }

    .sc-item:hover {
      background: #F3F4EF
    }

    .sc-item.on {
      background: var(--olive);
      color: var(--lime);
      font-weight: 600
    }

    .sc-item i {
      font-style: normal;
      font-family: var(--mono);
      font-size: 10px;
      opacity: .6;
      min-width: 20px
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    /* BROWSER MOCK */
    .bw {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(47, 58, 29, .12);
      direction: rtl
    }

    .bw-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 9px 14px;
      background: #ECEEE4;
      border-bottom: 1px solid var(--border)
    }

    .bw-bar b {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #C9CDBD
    }

    .bw-url {
      flex: 1;
      margin: 0 10px;
      background: #fff;
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 10px;
      font-family: var(--mono);
      color: var(--ink3);
      direction: ltr;
      text-align: left
    }

    .bw-body {
      display: grid;
      grid-template-columns: 150px 1fr;
      min-height: 420px;
      font-size: 11px
    }

    .bw-body.noside {
      grid-template-columns: 1fr
    }

    .m-side {
      background: var(--olive);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .m-logo {
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
      align-items: center
    }

    .m-logo s {
      width: 16px;
      height: 16px;
      border-radius: 5px;
      background: var(--lime);
      display: block
    }

    .m-nav {
      padding: 6px 8px;
      border-radius: 6px;
      color: rgba(255, 255, 255, .65);
      font-size: 10px
    }

    .m-nav.on {
      background: var(--lime);
      color: var(--olive);
      font-weight: 700
    }

    .m-main {
      padding: 14px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0
    }

    .m-top {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .m-title {
      font-weight: 700;
      font-size: 14px
    }

    .m-pill {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 9px;
      color: var(--ink2)
    }

    .m-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px
    }

    .m-grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px
    }

    .m-grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .m-grid2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px
    }

    .m-k {
      font-size: 9px;
      color: var(--ink3)
    }

    .m-v {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink)
    }

    .m-bar {
      height: 4px;
      background: #E9ECE1;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden
    }

    .m-bar u {
      display: block;
      height: 100%;
      background: var(--olive);
      border-radius: 3px
    }

    .m-line {
      height: 7px;
      background: #E9ECE1;
      border-radius: 4px;
      margin: 5px 0
    }

    .m-btn {
      display: inline-block;
      background: var(--lime);
      color: var(--olive);
      font-weight: 700;
      font-size: 10px;
      padding: 5px 12px;
      border-radius: 7px;
      text-align: center
    }

    .m-btn.out {
      background: #fff;
      border: 1px solid var(--border2);
      color: var(--ink2)
    }

    .m-bars {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      height: 90px
    }

    .m-bars u {
      flex: 1;
      background: var(--olive);
      border-radius: 3px 3px 0 0;
      opacity: .85
    }

    .m-bars u:nth-child(odd) {
      background: var(--lime);
      border: 1px solid var(--olive)
    }

    .m-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-size: 10px
    }

    .m-row:last-child {
      border: 0
    }

    .m-st {
      font-size: 9px;
      padding: 1px 8px;
      border-radius: 99px;
      background: var(--lime-soft);
      color: var(--olive);
      font-weight: 600;
      white-space: nowrap
    }

    .m-st.g {
      background: #E9ECE1;
      color: var(--ink2)
    }

    .m-map {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 34px);
      gap: 4px
    }

    .m-map u {
      border-radius: 6px;
      background: #E3E8D5;
      border: 1px dashed var(--border2)
    }

    .m-map u.a {
      background: var(--lime-soft);
      border: 1px solid var(--olive)
    }

    .m-map u.b {
      background: var(--olive)
    }

    .m-field {
      margin-bottom: 7px
    }

    .m-field s {
      display: block;
      font-size: 9px;
      color: var(--ink3);
      text-decoration: none;
      margin-bottom: 2px
    }

    .m-field u {
      display: block;
      height: 22px;
      border: 1px solid var(--border2);
      border-radius: 6px;
      background: #fff
    }

    .m-steps {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .m-steps u {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border2);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      text-decoration: none
    }

    .m-steps u.d {
      background: var(--olive);
      color: var(--lime);
      border-color: var(--olive)
    }

    .m-steps s {
      flex: 1;
      height: 2px;
      background: var(--border2)
    }

    .m-chat-a {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0 10px 10px 10px;
      padding: 6px 9px;
      max-width: 75%;
      font-size: 10px

          S("46", 'Supplier', "Import from Store (Plugin)", "استيراد المنتجات من متجرك", "Supplier", 1, ["steps", "table", "list"], "يربط المورد متجره على Shopify أو WooCommerce أو Zid أو EasyOrder أو Zammit ويسحب منتجاته كـ Draft للمنصة، مع معاينة وربط التصنيفات وتقرير أخطاء قبل الحفظ.", "Entry points: Supplier sidebar > Product Management > Import from store, and the connected stores card on Supplier Dashboard. Connected stores list: platform logo, store URL, status (Connected / Error / Disconnected), sync mode (Manual / Price & stock / Full), last sync, products count, actions (Import, Sync now, Settings, Disconnect). Wizard stepper: 1 Choose platform (Shopify, WooCommerce, Zid, EasyOrder, Zammit) and enter store URL > 2 Authorize (OAuth or API keys, encrypted, connection test) > 3 Fetching catalog with progress bar and count > 4 Preview and select products (table with image, title, SKU, price, stock, variants, per-row status Ready / Warning / Error, select all) and category mapping panel (store category to Plant Green category) > 5 Error report before saving (missing images, zero price, duplicate SKU, unmapped category) > 6 Confirm and import as Draft. Result screen: imported / skipped / failed counts, download error report, button Review drafts in Product Management. Sync settings drawer: mode, frequency, fields to sync, conflict rule (never overwrite my edits). Variants handling: decision pending. States: connection failed, token expired (reconnect), rate-limited (retry later), empty catalog."),

          S('38', 'Admin', 'Integration Monitoring', 'مراقبة التكاملات', 'Platform Admin', 1, ['kpi', 'table', 'list'], 'حالة مزامنة Odoo وTasleem والـ Logs والأخطاء.', 'Six integration status cards (Odoo, Tasleem, SideUp, Flexbox, Paymob, MyFatoorah): last sync, success rate, failed events. Logs table with retry action, duplicate-event flag, external reference IDs.'),
          S("39", 'Admin', "Staff Overview", "نظرة عامة (الموظفين)", "Platform Admin", 0, ["filters", "kpi", "kpi", "chart", "list"], "الصفحة الرئيسية لداش بورد الموظفين: KPIs للمستخدمين والمزارع والأجهزة والأوردرات والإيراد، قمع الليدز، الإيراد مقابل المصروفات، والإجراءات المعلقة.", "Topbar: global search (client / order / lead), period filter (last 30 days), AR | EN, notifications (3). Period chips: Today, Yesterday, This week, This month (active), Last month, Custom range + Farm filter + User type filter + Refresh with last-updated time. Critical alert banner (e.g. Tasleem sync failure, link to review log). KPI row 1: Total users 1,240 (+8% vs previous period), Active farms 318 (+4%), Connected devices 1,150 (status: healthy), Disconnected devices 54 (+6 vs yesterday), Total orders 686 (+12%). KPI row 2: Total revenue N/A (pending revenue definition), Open leads 93 (-3%), Open support tickets 6 (+2). Charts: Revenue vs Expenses (6 months, dark = revenue, light = expenses) and Leads funnel (New 120, No answer 84, Interested 48, Follow-up 36, Converted 22, Rejected 30; click to filter). Bottom row: Pending actions (late follow-ups 7, clients without account manager 4, pending orders 12, pending returns 3, suppliers awaiting approval 2, open tickets 6), Farm & IoT monitoring (view only: connected 1,150, disconnected 54, devices with errors 12, farms with stale data 9, last update 3 min, source IoT gateway - no control commands for staff), Recent activity (new user, device lost connection, new order, Odoo sync failure, new support ticket). Sidebar groups: Overview, Business operations, Farms & Agriculture, IoT & technical monitoring, Store management, Finance & Services, Integrations & System, Analytics & Reports, Administration."),
          S("40", 'Admin', "Client Profile", "ملف العميل", "Platform Admin", 0, ["kpi", "table", "list"], "ملف العميل الكامل: مسؤول المبيعات ومدير الحساب مع زرار التغيير، تبويبات (المدفوعات والاشتراكات والملاحظات...)، وحالة Churn.", "Breadcrumb: Users & Clients > Client profile. Header: avatar, client name, badges (type e.g. Farmer, status Active, plan Pro, Sample data) and primary button Register payment. Two assignment cards: Sales owner (name + Change sales owner) and Account manager (name + Change account manager); every change is logged. Tabs: Overview, Account data, Farms, Orders, Payments (active in the reference), Subscriptions, Support tickets, Notes, Activity. Payments tab: 3 KPIs (Total due, Paid, Remaining, in EGP) + Payment log table (Date, Amount, Method e.g. transfer / cash, Reference, Recorded by). Churn status card: last eligible order 74 days ago, threshold for farmers 90 days, badge Near churn. Notes panel (left): entries from account manager and sales, add-note textarea + Add button."),
          S("41", 'Admin', "Leads Management", "إدارة الليدز", "Platform Admin", 0, ["filters", "kpi", "table"], "إدارة الليدز (العملاء المحتملين): استيراد Excel، إسناد جماعي، فلاتر، جدول بحالات، وعرض كانبان.", "Title: Potential customers (Leads). Actions: Import Excel (primary), Bulk assign, Export. View toggle: Table / Kanban. Topbar: global search, last 30 days, AR | EN, notifications. KPI strip (8): Total leads, New, Follow-ups today, Late follow-ups, Interested, Converted, Rejected, Conversion rate. Filters: Status, Source, Region, Owner, Created date, Follow-up date. Bulk bar when rows selected: \"2 records updated - Assign to employee - Change status\". Table: checkbox, Name, Phone, Region, Source (Excel sheet / referral), Owner (Sales 1 / Sales 2), Status badge (New, No answer, Interested, Follow-up, Converted, Rejected), Last contact, Next follow-up; pagination \"Showing 1-6 of 93\". Import stages card: Upload file > Preview > Map columns > Validate > Duplicate detection (by phone) > Summary > Confirm > Save records."),
          S("42", 'Admin', "Farm Details (Read-only)", "تفاصيل المزرعة (مراقبة فقط)", "Platform Admin", 0, ["kpi", "table", "table"], "مراقبة مزرعة عميل للقراءة فقط: المناطق وآخر القراءات وسجل الري والـ Canopy، بدون أي أوامر تحكم للموظفين.", "Breadcrumb: Farms > Sample farm. Actions: Export monitoring report, AR | EN, Sample data badge. Green banner: view and monitor only - no irrigation or Canopy commands or device settings for staff. Farm header: name, status Active, last data 3 min ago, owner, location, area. Tabs: Overview, Zones (active), Soil & environment, Devices, Weather, Irrigation, Canopy, Alerts, Activity. KPIs: Zones 3, Devices 12, Active alerts 2, Last update 3 min (source IoT gateway). Zones & latest readings table: Zone, Area, Sensors, Soil moisture, Temperature, Status (Normal / Warning / Critical), Last reading. Two read-only logs: Irrigation log (Time, Zone, Recorded duration, Source unknown or manual by client, Status Completed / Failed) and Canopy log (Time, Event Open / Close, Reason rain / schedule). Footnote: warning and critical thresholds follow the approved settings per sensor and crop. Sidebar sub-items under Farms & Agriculture: Farms overview, Farm & zone details, Soil & environment, Weather, Irrigation activity, Canopy activity."),
          S("43", 'Admin', "Finance", "المالية", "Platform Admin", 0, ["kpi", "chart", "table"], "المالية: KPIs، الإيراد مقابل المصروفات، المصروفات حسب التصنيف، وجدول الحركات (أوتوماتيك / يدوي) مع إضافة حركة يدوية.", "Title: Finance. Actions: Add manual entry (primary), Export, AR | EN, Sample data badge. KPI row (6): Revenue N/A, Expenses, Net profit (estimate) N/A = revenue - expenses, Pending payments, Refunds, Outstanding balances. Cards: Revenue vs Expenses (monthly chart for last 12 months, shown after revenue definition is approved) and Expenses by category (Salaries, Shipping, Marketing, Platform subscriptions, Maintenance, Other) as horizontal bars. Transactions table: Date, Type (Revenue / Expense), Category, Amount, Source badge (Automatic / Manual), Linked item (e.g. order #1003, #1001, 2 clients), Action (Read-only for automatic entries, Edit for manual). Footnote: automatic entries are read-only; deletion needs a separate restricted permission; every change is recorded in the audit log. Sidebar group Finance & Services: Finance (active), Subscriptions, Insurance, Support center, Maintenance requests, Consulting services."),
          S("44", 'Admin', "Staff & Permissions", "الموظفون والصلاحيات", "Platform Admin", 0, ["table", "table", "list"], "إدارة الموظفين وأدوارهم، ومصفوفة صلاحيات لكل دور، مع منع أوامر التحكم في الري والـ Canopy والأجهزة لكل الأدوار.", "Title: Staff & Permissions. Actions: Invite employee (primary), AR | EN, Sample data badge. Employees table: Employee, Role (Admin; Sales; Account Manager + Sales; Accounts), Status (Active / Suspended), Leads, Clients, Last login (e.g. Sales 40 leads; Account Manager + Sales 12 leads and 58 clients). Permissions matrix with role selector chips (Sales, Accounts, Account Manager, Admin): rows = modules (Leads, Clients, Orders, Finance, Farms monitoring, IoT devices monitoring), columns = View, Add, Edit, Delete, Approve, Export; cell values Allowed / Limited / Restricted / None. Red note: prohibited for all roles - controlling irrigation and Canopy, device settings and IoT commands. Card Change of assignment: any change to a role, permission or client owner is recorded in the audit log with the reason. Sidebar group Administration: Employees, Roles & permissions (active), Alerts, Activity & audit log, Internal notes, Settings."),
          S('45', 'Plant Green Academy', 'Plant Green Academy', 'أكاديمية بلانت جرين', 'All (Owner, Business, Supplier)', 0, ['filters', 'video', 'cards'], 'مكتبة فيديوهات شرح للمنصة (البدء، مراقبة المزرعة، الري، المتجر، الخدمات، التأمين، الذكاء الاصطناعي) مع تتبع التقدم.', 'Header with search + category chips (Getting started, Farm monitoring, Irrigation & Canopy, Marketplace, Services, Insurance, AI). Featured video player with chapters, transcript and AR/EN captions, plus a playlist with watched / not-watched state and progress bar. Below: Continue watching row and video cards grid (thumbnail, duration, level, category). Bookmark / Mark as watched actions. Open point: video hosting provider to be decided.'),

[Route("api/zones/{zoneId:guid}/irrigation")]
[Authorize]
public class IrrigationController(IDispatcher dispatcher) : ControllerBase
{
    [HttpPost("start")]
    [HasPermission(Permissions.IrrigationControl)]
    public async Task<IActionResult> Start(
        Guid zoneId, StartIrrigationRequest req, CancellationToken ct)
    {
        var result = await dispatcher.Send(
            new StartIrrigationCommand(zoneId, req.DurationMin, User.GetUserId()), ct);

        // 202: الأمر اتسجل، والتأكيد الفعلي بييجي من الجهاز (ack)
        return result.IsSuccess ? Accepted(result.Value) : result.ToProblem();
    }
}`},

${ s.desc }

${ s.content }

      });
      let lang = PROJECT.langs[0], mode = 'light', cur = null;
      const grid = $('#pg-grid');
      const draw = () => {
        grid.innerHTML = PROJECT.screens.map(s => `<button class="pg-sc ${ cur === s.id ? 'on' : '' }" data-id="${ s.id }"><small>Screen ${ s.id } · ${ esc(s.g) }</small><b>${ esc(s.name[lang] || s.name.en) }</b></button>`).join('');
        $$('.pg-sc', grid).forEach(b => b.onclick = () => { cur = b.dataset.id; draw(); show() });
      };
      const show = () => {
        if (!cur) return; const s = PROJECT.screens.find(x => x.id === cur);
        $('#pg-out').style.display = 'block';
        $('#pg-meta').innerHTML = `<b>Screen ${ s.id }/${ PROJECT.screens.length }</b> — ${ esc(s.name[lang] || s.name.en) } · ${ PROJECT.promptGen.langs[lang].label } · ${ mode }`;
        $('#pg-text').textContent = buildPrompt(s, lang, mode); $('#pg-copy').textContent = 'Copy Prompt';
      };
      $$('#pg-lang .tab').forEach(b => b.onclick = () => { lang = b.dataset.v; $$('#pg-lang .tab').forEach(x => x.classList.remove('on')); b.classList.add('on'); draw(); show() });

        const h = document.documentElement, m = h.scrollHeight - innerHeight;
        bar.style.transform = 'scaleX(' + (m > 0 ? Math.min(scrollY / m, 1) : 0) + ')'; up.classList.toggle('show', scrollY > 600)
      }, { passive: true });

      /* 3D tilt on the screen mockup (follows the pointer) */
      if (!RM && matchMedia('(pointer:fine)').matches) {
        const reset = () => document.querySelectorAll('.bw.tilt').forEach(x => { x.classList.remove('tilt'); x.style.transform = '' });
        document.addEventListener('pointermove', e => {
          const b = e.target.closest && e.target.closest('.bw');
          document.querySelectorAll('.bw.tilt').forEach(x => { if (x !== b) { x.classList.remove('tilt'); x.style.transform = '' } });
          if (!b) return; const r = b.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
          b.classList.add('tilt'); b.style.transform = 'perspective(1400px) rotateY(' + (x * 5) + 'deg) rotateX(' + (-y * 4) + 'deg)';
        });
        document.documentElement.addEventListener('pointerleave', reset);
      }

      /* 3D hero: a farm of soil beds, a sliding canopy, rain and sensor pulses */
      if (RM) return;
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      s.onload = hero3d; document.head.appendChild(s);

      function hero3d() {
        const T = THREE, cv = document.createElement('canvas'); cv.className = 'hero3d'; cv.setAttribute('aria-hidden', 'true');
        let R; try { R = new T.WebGLRenderer({ canvas: cv, alpha: true, antialias: true }) } catch (e) { return }
        R.setPixelRatio(Math.min(devicePixelRatio, 2));
        const sc = new T.Scene(), cam = new T.PerspectiveCamera(32, 1, .1, 100);
        sc.add(new T.AmbientLight(0xffffff, .7));
        const dl = new T.DirectionalLight(0xdfffa0, .9); dl.position.set(4, 9, 5); sc.add(dl);
        const G = new T.Group(); sc.add(G);

        const N = 9, M = 6, beds = [], bg = new T.BoxGeometry(.92, 1, .92);
        for (let i = 0; i < N; i++)for (let j = 0; j < M; j++) {
          const m = new T.Mesh(bg, new T.MeshStandardMaterial({ color: new T.Color().setHSL(.22 + .04 * Math.random(), .5, .2 + .24 * (i / N)), roughness: .7 }));
          m.position.set((i - (N - 1) / 2) * 1.02, 0, (j - (M - 1) / 2) * 1.02); m.userData = { i: i, j: j }; G.add(m); beds.push(m);
        }
        const can = new T.Mesh(new T.BoxGeometry(3, .06, 3), new T.MeshStandardMaterial({ color: 0xCFFF74, transparent: true, opacity: .5 }));
        can.position.y = 2.3; G.add(can);

        const dg = new T.SphereGeometry(.045, 8, 8), dm = new T.MeshBasicMaterial({ color: 0xCFFF74 }), drops = [];
        const rs = (d, f) => { d.position.set((Math.random() - .5) * 9, f ? Math.random() * 5 : 5.5, (Math.random() - .5) * 6); d.userData.v = .025 + Math.random() * .03 };
        for (let k = 0; k < 70; k++) { const d = new T.Mesh(dg, dm); rs(d, 1); G.add(d); drops.push(d) }

        const rg = new T.RingGeometry(.3, .34, 40), pulses = [];
        for (let k = 0; k < 5; k++) {
          const p = new T.Mesh(rg, new T.MeshBasicMaterial({ color: 0xCFFF74, transparent: true, side: T.DoubleSide }));
          p.rotation.x = -Math.PI / 2; p.position.set((Math.random() - .5) * 7, .9, (Math.random() - .5) * 4.5); p.userData.o = Math.random(); G.add(p); pulses.push(p);
        }

        let mx = 0, my = 0; addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5 }, { passive: true });
        const fit = () => {
          const p = cv.parentNode; if (!p) return; const w = p.clientWidth, h = p.clientHeight; if (!w || !h) return;
          R.setSize(w, h, false); cam.aspect = w / h; cam.position.set(0, w < 700 ? 17 : 10, w < 700 ? 19 : 16); cam.lookAt(0, .4, 0);
          G.scale.setScalar(w < 700 ? .8 : 1.25); cam.updateProjectionMatrix()
        };
        addEventListener('resize', fit);

        /* the hero is re-rendered on language switch: re-attach the same canvas */
        const mount = () => { const h = $('#page-vision .hero'); if (h && cv.parentNode !== h) { h.prepend(cv); fit() } };
        mount(); new MutationObserver(mount).observe($('#page-vision'), { childList: true });

        const clk = new T.Clock();
        (function loop() {
          requestAnimationFrame(loop);
          if (document.hidden || !cv.isConnected || !cv.offsetWidth) return;
          const t = clk.getElapsedTime();
          G.rotation.y = t * .07 + mx * .5; G.rotation.x = my * .15;
          beds.forEach(b => { const h = .7 + .4 * Math.sin(t * 1.1 + b.userData.i * .55 + b.userData.j * .7); b.scale.y = h; b.position.y = h / 2 });
          can.position.x = Math.sin(t * .5) * 3.2;
          drops.forEach(d => { d.position.y -= d.userData.v; if (d.position.y < .6) rs(d) });
          pulses.forEach(p => { const k = (t * .4 + p.userData.o) % 1; p.scale.setScalar(1 + k * 3); p.material.opacity = .9 * (1 - k) });
          R.render(sc, cam);
        })();
      }
    })();
  </script>


  <style>
    .gantt {
      padding: 22px 26px;
      margin-bottom: 22px
    }

    .gt-axis,
    .gt-row {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 14px;
      align-items: center
    }

    .gt-ticks {
      position: relative;
      height: 18px;
      font: 500 11px var(--mono);
      color: var(--ink3)
    }

    .gt-ticks span {
      position: absolute;
      top: 0
    }

    .gt-row {
      padding: 9px 0;
      border-top: 1px solid var(--border)
    }

    .gt-name {
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .gt-risk {
      font-size: 11px;
      font-weight: 600;
      color: #9A3412
    }

    [data-theme=dark] .gt-risk {
      color: #F2A184
    }

    .gt-track {
      position: relative;
      height: 32px;
      border-radius: 8px;
      background: rgba(47, 58, 29, .05)
    }

    .gt-bar {
      position: absolute;
      inset-block: 3px;
      inset-inline-start: var(--s);
      width: var(--w);
      background: var(--c);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 100% 50%;
      transform: scaleX(0);
      transition: transform .9s cubic-bezier(.22, 1, .36, 1) var(--d)
    }

    .gt-bar b {
      font: 600 11px var(--mono)
    }

    .gantt.in .gt-bar {
      transform: none
    }

    @media(max-width:700px) {

      .gt-axis,
      .gt-row {
        grid-template-columns: 1fr
      }

      .gt-axis>div:first-child {
        display: none
      }
    }

    .bar u {
      transition: width 1s cubic-bezier(.22, 1, .36, 1)
    }

    .cb u {
      transition: height 1s cubic-bezier(.22, 1, .36, 1)
    }

    .tabs {
      position: relative
    }

    .tabs .tab {
      position: relative;
      z-index: 1
    }

    .tabs .tab.on {
      background: transparent;
      border-color: transparent
    }

    [data-theme=dark] .tabs .tab.on {
      background: transparent;
      color: #2F3A1D
    }

    .tab-ind {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 99px;
      background: var(--olive);
      z-index: 0;
      pointer-events: none
    }

    [data-theme=dark] .tab-ind {
      background: var(--lime)
    }

    .tab-ind.ready {
      transition: transform .35s cubic-bezier(.22, 1, .36, 1), width .35s, height .35s
    }

    @media(prefers-reduced-motion:reduce) {
      .gt-bar {
        transform: none
      }
    }
  </style>
  <script>
    (function () {
      const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* roadmap: Gantt over 42 weeks, with the open High-severity decisions per phase */
      const w = document.querySelector('#page-roadmap .wrap');
      if (w && typeof PROJECT !== 'undefined') {
        const TOT = 42, risks = PROJECT.risks.items;
        const ink = h => { const n = parseInt(h.slice(1), 16); return .299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255) > 150 ? '#1D2412' : '#fff' };
        const rows = PROJECT.roadmap.phases.map((p, i) => {
          const m = p.weeks.match(/(\d+)\D+(\d+)/), a = +m[1], b = +m[2], n = p.name.match(/Phase (\d)/)[1];
          const hi = risks.filter(r => r[0] === 'High' && r[3] === 'Phase ' + n).length;
          return '<div class="gt-row"><div class="gt-name">' + p.name.replace(/^Phase \d\s*—\s*/, '') + (hi ? '<span class="gt-risk">High مفتوح: ' + hi + '</span>' : '') + '</div>' +
            '<div class="gt-track"><i class="gt-bar" style="--c:' + p.c + ';--s:' + ((a - 1) / TOT * 100) + '%;--w:' + ((b - a + 1) / TOT * 100) + '%;--d:' + (i * 90) + 'ms"><b style="color:' + ink(p.c) + '">W' + a + '–' + b + '</b></i></div></div>';
        }).join('');
        const ticks = [1, 8, 16, 22, 28, 36, 42].map(k => '<span style="inset-inline-start:' + ((k - 1) / TOT * 100) + '%">W' + k + '</span>').join('');
        const el = document.createElement('div'); el.className = 'card flat gantt';
        el.innerHTML = '<div class="gt-axis"><div></div><div class="gt-ticks">' + ticks + '</div></div>' + rows;
        (w.querySelector('.callout') || w.querySelector('.lead')).after(el);
      }

      /* values count up and bars fill the first time a card is seen */
      if (!RM) {
        const count = el => {
          const m = el.textContent.trim().match(/^([\d.,]+)(.*)$/); if (!m) return;
          const end = parseFloat(m[1].replace(/,/g, '')), dec = (m[1].split('.')[1] || '').length, sep = m[1].indexOf(',') > -1, t0 = performance.now();
          (function f(n) {
            const k = Math.min((n - t0) / 900, 1), v = end * (1 - Math.pow(1 - k, 3));
            el.textContent = (sep ? v.toLocaleString('en', { maximumFractionDigits: dec }) : v.toFixed(dec)) + m[2];
            if (k < 1) requestAnimationFrame(f)
          })(t0)
        };
        const io = new IntersectionObserver(es => es.forEach(e => {
          if (!e.isIntersecting) return; io.unobserve(e.target); const c = e.target; c.classList.add('in');
          c.querySelectorAll('[data-w]').forEach(u => u.style.width = u.dataset.w);
          c.querySelectorAll('[data-h]').forEach(u => u.style.height = u.dataset.h);
          c.querySelectorAll('.sv').forEach(count);
        }), { threshold: .25 });
        document.querySelectorAll('.stat u').forEach(u => { u.dataset.w = u.style.width; u.style.width = '0%' });
        document.querySelectorAll('.cb u').forEach(u => { u.dataset.h = u.style.height; u.style.height = '0%' });
        document.querySelectorAll('.stat,.cb,.gantt').forEach(c => io.observe(c));
      }

      /* one sliding pill under the active tab */
      document.querySelectorAll('.tabs').forEach(c => {
        const ind = document.createElement('i'); ind.className = 'tab-ind'; c.prepend(ind);
        const place = () => {
          const b = c.querySelector('.tab.on'); if (!b || !b.offsetWidth) return;
          ind.style.width = b.offsetWidth + 'px'; ind.style.height = b.offsetHeight + 'px';
          ind.style.transform = 'translate(' + b.offsetLeft + 'px,' + b.offsetTop + 'px)';
          requestAnimationFrame(() => ind.classList.add('ready'))
        };
        c.addEventListener('click', () => requestAnimationFrame(place));
        new ResizeObserver(place).observe(c); place();
      });
    })();
  </script>


  <style>
    /* cards: depth answers the pointer; flat cards stay quiet */
    .card {
      position: relative;
      transition: transform .35s cubic-bezier(.22, 1, .36, 1), box-shadow .35s, border-color .35s
    }

    .card:not(.flat)::before {
      content: '';
      position: absolute;
      inset-block: 16px;
      inset-inline-start: 0;
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(var(--lime), #8FB43A);
      transform: scaleY(0);
      transition: transform .35s cubic-bezier(.22, 1, .36, 1)
    }

    .card:not(.flat):hover {
      transform: translateY(-4px);
      border-color: #B9D86B;
      box-shadow: 0 18px 36px -14px rgba(47, 58, 29, .28), 0 4px 10px -4px rgba(143, 180, 58, .35)
    }

    .card:not(.flat):hover::before {
      transform: scaleY(1)
    }

    [data-theme=dark] .card:not(.flat):hover {
      border-color: rgba(207, 255, 116, .45);
      box-shadow: 0 18px 36px -14px rgba(0, 0, 0, .6)
    }
  </style>
  <script>
    /* first visit to a tab: the first 8 cards of each grid settle in, 30ms apart */
    (function () {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const seen = new Set();
      const run = id => {
        if (seen.has(id)) return; seen.add(id);
        const pg = document.getElementById('page-' + id); if (!pg) return;
        pg.querySelectorAll('.grid').forEach(g => [...g.children].slice(0, 8).forEach((c, i) =>
          c.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }],
            { duration: 380, delay: i * 30, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' })));
      };
      seen.add('vision');
      document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => requestAnimationFrame(() => run(b.dataset.id))));
    })();
  </script>
